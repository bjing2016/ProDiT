        num_samples: 100
        guidance: 3
        sample_length: 300
        batch: 100
        steps: 600
        skew: 1.0
        struct:
            edm: ${edm}
            temp_factor: 0.5
            sde_weight: 1.0
            align: false
            sde_exp: 0
        seq:
            temp_start: 0.1
            temp_end: 0.1
            strategy: random
            noise: 20
            logits: standard
            adjust_unmasked: false # pseudo-masked logits
            replace_unmasked: false # logit of current toks
            topk_temp: 0.0
            allow_mutation: false
        go_vocab: splits/go_vocab.json 
        target_go_terms: splits/deepfri_molecular_function_terms.txt
        max_depth: 86
        threshold: 0.25
        savedir: experiments/function/len300_guid3_100_exp0

tracks:
    # register tracks here
    StructureTrack: 
        loss_weight: 1.0
        embed_motif: true
        embed_float_motif: true
        embed_ligand: false
        embed_nma: false
        embed_mask_as_noise: true
        edm: ${edm}
        all_atom: ${data.all_atom}
        readout_adaLN: false
        loss:
            mse: 1.0
            aligned_mse: 0.0
            lddt: 0.0
        diffusion:
            type: EDMDiffusion
            data_sigma: ${edm.sigma_data}
            train_align: false
        
    SequenceTrack:
        esm: # esm2_3B # esm2_650M # esm2_8M_270K
        loss_weight: 3.0 
        esm_lm_head: true
        tied_weights: false
        reweight: linear
        func_cond: false
        reweight_eps: 0.01
        init: 0.02
        all_atom: ${data.all_atom}
        mlm_prob: 0.00
        mlm_ratio: 1.0
        mlm_weight: 1.0

    FunctionTrack:
        loss_weight: 0.0
        go_vocab: splits/go_vocab.json
        drop_prob: 0.15
    
model: # custom args
    ema: 0.999
    self_cond: false
    self_cond_prob: 0.0
    dim: 1024
    heads: 16
    blocks: 30
    dropout: 0.2
    token_dropout: 0.0
    ff_expand: 4
    rope_attn: true
    rope_values: true
    attn_mask: 
    cross_attn: false
    adaLN: true
    qk_norm: true
    act: gelu
    ligand: false

optimizer:
    type: AdamW
    lr: 1e-4
    # betas: [0.9, 0.98]
    # eps: 1e-8
    # weight_decay: 0.01
    # fused: true
    scheduler: 
        total_steps: 1000000
        warmup_steps: 1000
        start_decay: 10000
        end_factor: 0.1
