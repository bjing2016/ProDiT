ckpt: 576M.ckpt
pretrained:  #  load weights from here first
validate: true # if true, only validate the model, don't train
logger:
    # set to true to log to neptune.ai
    neptune: false
    run_id: 
    # please change "test" to something unique to your task
    project: your-workspace/your-project
    # will log to workdir and neptune.ai with this name
    name: func-eval
    # if not null, will duplicate stdout and stderr to workdir/{name}/{logfile}
    logfile: std.out
    # if null, will log every epoch, otherwise every this number of steps
    train_log_freq: 100
    val_log_freq: null 
    ckpt_freq: 50000000000
    save_freq: 1000
trainer:
    accelerator: auto
    devices: 8
    max_epochs: 1
    max_steps: 1000000
    enable_progress_bar: false
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    num_sanity_val_steps: 0
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
    val_check_interval: 10000
    check_val_every_n_epoch: 1
    logger: false
    precision: 16-mixed

# custom args to OpenProtDataset and elsewhere
data: 
    num_workers: 16
    buffer: 1000
    max_sq_toks: 
    max_toks: 16384
    batch: null
    crop: 512
    seed: 1780
    all_atom: false

# These are the raw features which are expected to be supplied by the Datasets
# before they are TOKENIZED by the Tracks.
# We specify them and their shapes so that datasets can supply default values if missing
# for example, a structure dataset will not supply any dynamics information.
# We also need to set defaults for the "mask" and "noise" because not all Tasks will set them.
# -1 means this is the LEGNTH dim. 
features:
    # sequence feats
    atom_num: [-1] # ligands only
    mol_type: [-1] # default 0 = protein
    residx: [-1]
    chain: [-1]
    
    seq_mask: [-1]
    seq_noise: [-1]
    
    struct: [-1, 3]
    struct_mask: [-1]
    struct_noise: [-1]

    nma: [-1, 3]
    nma_mask: [-1]

    motif: [-1, 3] 
    motif_mask: [-1]
    motif_float_mask: [-1]
    motif_idx: [-1]
    motif_nma: [-1, 3]
    motif_nma_mask: [-1]
    
    ligand_mask: [-1]
    hotspot_mask: [-1]

    cath: [-1, 3]
    cath_noise: [-1]

    go_terms: [-1]
    go_noise: [-1]

    sites: [-1, 12]
    site_noise: [-1]

edm:
    sched_p: 7
    sigma_max: 160
    noise_max: ${edm.sigma_max}
    sigma_min: 0.05
    sigma_data: 15
    sigma_perturb: 0
    center: true

motif:
    nmax: 4
    ymin: 0.05
    ymax: 0.35
    weight: 1.0
    multi_prob: 0.0
    nma_prob: 0.0
    float_prob: 0.5

ppi:
    contact: 8
    long_range: 24
    gap_pad: 5
    gap_min: 12
    gap_max: 24
    hotspot: 12
    
datasets: []

    
tasks: []

